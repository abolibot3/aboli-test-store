    const ADMIN_PASS = 'admin123'; // می‌تونی عوضش کنی
   let allAdminProducts = [];

async function loadAdminProducts() {
  const list = document.getElementById('adminProductsList');
  list.innerHTML = '<p style="color:var(--text-secondary);text-align:center;">در حال بارگذاری...</p>';

  try {
    const res = await fetch('/api/products');
    if (!res.ok) throw new Error('خطا در دریافت');
    allAdminProducts = await res.json();

    console.log('تعداد محصولات ادمین:', allAdminProducts.length); // برای تست

    applyAdminSearch();
  } catch (e) {
    console.error(e);
    list.innerHTML = '<p style="color:var(--danger);text-align:center;">خطا در بارگذاری محصولات</p>';
    showToast('خطا در بارگذاری محصولات', 'error');
  }
}

function applyAdminSearch() {
  const input = document.getElementById('adminSearch');
  const q = (input?.value || '').trim().toLowerCase();
  const list = document.getElementById('adminProductsList');

  // اگر هنوز لود نشده
  if (!allAdminProducts || allAdminProducts.length === 0) {
    list.innerHTML = '<p style="color:var(--text-secondary);text-align:center;">محصولی برای نمایش نیست</p>';
    return;
  }

  let filtered = allAdminProducts;

  if (q) {
    filtered = allAdminProducts.filter(p => {
      const name = (p.name || '').toLowerCase();
      const cat = (p.category || '').toLowerCase();
      return name.includes(q) || cat.includes(q);
    });
  }

  if (!filtered.length) {
    list.innerHTML = '<p style="color:var(--text-secondary);text-align:center;padding:20px;">محصولی یافت نشد</p>';
    return;
  }

  list.innerHTML = filtered.map(p => {
    // برای onclick امن‌تر (بدون مشکل کوتیشن)
    const safe = encodeURIComponent(JSON.stringify(p));
    return `
      <div class="admin-product-item">
        <div class="info">
          <div class="name">${p.name}</div>
          <div class="meta">${p.category} — ${Number(p.price).toLocaleString('fa-IR')} تومان — موجودی: ${p.stock ?? 0}</div>
        </div>
        <div class="actions">
          <button class="edit-btn" data-product="${safe}">ویرایش</button>
          <button class="delete-btn" onclick="deleteProduct(${p.id})">حذف</button>
        </div>
      </div>
    `;
  }).join('');

  // وصل کردن دکمه ویرایش
  list.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const product = JSON.parse(decodeURIComponent(btn.dataset.product));
      openEditModal(product);
    });
  });
}

    async function deleteProduct(id) {

        const res = await fetch(`/api/products/${id}`, { method: 'DELETE' , headers: { 'Content-Type': 'application/json' ,

  document.getElementById('editCategory').value = product.category;
  document.getElementById('editStock').value = product.stock ?? 0;
  document.getElementById('editPrice').value = product.price;
document.getElementById('editOriginalPrice').value = product.originalPrice || '';

  const preview = document.getElementById('editPreviewImg');
  if (product.image && product.image.startsWith('data:')) {
    preview.src = product.image;
    preview.style.display = 'block';
  } else {
    preview.style.display = 'none';
  }

  openModal('editModal');

// فشرده‌سازی تصویر و تبدیل به Base64 (زیر 250KB)
function compressImage(file, maxSizeKB = 250, maxWidth = 800) {
  return new Promise((resolve, reject) => {
    if (!file || !file.type.startsWith('image/')) {
      return reject(new Error('فایل تصویر معتبر نیست'));
    }

    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;

        // کوچک کردن ابعاد اگر خیلی بزرگ باشه
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // کیفیت رو کم کم پایین میاریم تا حجم زیر 250KB بشه
        let quality = 0.85;
        let dataUrl = canvas.toDataURL('image/jpeg', quality);

        while (dataUrl.length > maxSizeKB * 1024 * 1.37 && quality > 0.3) {
          // 1.37 تقریباً ضریب base64 هست
          quality -= 0.07;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }

        resolve(dataUrl);
      };
      img.onerror = () => reject(new Error('خطا در بارگذاری تصویر'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('خطا در خواندن فایل'));
    reader.readAsDataURL(file);
  });
}

// پیش‌نمایش عکس افزودن
document.getElementById('pImageFile')?.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const dataUrl = await compressImage(file);
    document.getElementById('previewImg').src = dataUrl;
    document.getElementById('imagePreview').style.display = 'block';
    // موقتاً ذخیره می‌کنیم
    window._pendingImage = dataUrl;
  } catch (err) {
    showToast(err.message, 'error');
  }
});

// پیش‌نمایش عکس ویرایش
document.getElementById('editImageFile')?.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const dataUrl = await compressImage(file);
    const img = document.getElementById('editPreviewImg');
    img.src = dataUrl;
    img.style.display = 'block';
    window._pendingEditImage = dataUrl;
  } catch (err) {
    showToast(err.message, 'error');
  }
});
  </script>
</body>
